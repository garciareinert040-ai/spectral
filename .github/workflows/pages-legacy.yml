name: Switch Pages to branch mode

# O environment github-pages deste repo rejeita deploys de qualquer branch
# (política herdada exige branches protegidos). No modo clássico "deploy from
# branch", o GitHub gerencia essa política automaticamente — este workflow
# apenas troca a fonte do Pages para o branch gh-pages via API.
on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Update Pages source to gh-pages branch
        run: |
          curl -sS -f -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo "Pages agora serve do branch gh-pages."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
