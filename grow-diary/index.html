<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Diário de Cultivo · Auto Pineapple Express</title>
  <meta name="description" content="Diário diário de cultivo — versão viva do guia, ancorada na data de plantio, com sincronização na nuvem.">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cultivo">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">

  <!-- Fontes: Playfair Display (títulos) · DM Sans (corpo) · JetBrains Mono (dados) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Gráficos (global `Chart`) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="root">
    <div class="full-loader"><div style="text-align:center"><div class="spin"></div><div>Carregando…</div></div></div>
  </div>

  <!-- App (ES module: importa o Firebase SDK modular por CDN) -->
  <script type="module" src="./js/app.js"></script>

  <!-- Registro do Service Worker (PWA / app shell offline) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW:', e));
      });
    }
  </script>
</body>
</html>
